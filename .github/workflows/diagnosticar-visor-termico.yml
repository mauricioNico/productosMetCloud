name: Diagnóstico visor térmico con artefacto GRIB validado
on:
  workflow_dispatch:
  push:
    branches: [feature/anomalia-temperatura-24-48-72]
    paths:
      - .github/workflows/diagnosticar-visor-termico.yml
      - web/monitoreo-extremo/tests/localidades-browser.py
      - web/monitoreo-extremo/index.html
permissions:
  contents: write
  actions: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: alertas-regionales-reales-EXPERIMENTAL
          run-id: 38915266753
          github-token: ${{ github.token }}
          path: /tmp/capas
      - name: Construir ZIP meteorológico desde artefacto validado
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path('/tmp/capas')
          m=json.loads((p/'manifest.json').read_text())
          assert m['temperatura']['normal']=='NASA POWER / MERRA-2 1991-2020'
          with zipfile.ZipFile('/tmp/real.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for f in p.iterdir():
                  if f.suffix in ('.csv','.json','.geojson'):z.write(f,arcname=f.name)
          Path('/tmp/meta.json').write_text(json.dumps({'estado':'PUBLICADO','ciclo_utc':m['run_time'],'publicado_utc':m['run_time'],'publicacion_autorizada':False}))
          print('Tamaño ZIP',Path('/tmp/real.zip').stat().st_size)
          PY
      - name: Preparar Chromium
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Diagnosticar representación de seis mapas y tooltips
        run: |
          python web/monitoreo-extremo/tests/localidades-browser.py \
            --zip /tmp/real.zip --metadata /tmp/meta.json \
            --screenshot /tmp/mapas-termicos.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-anomalias-6-mapas
          path: /tmp/mapas-termicos.png
          if-no-files-found: ignore

      - name: Conservar captura revisable en rama de desarrollo
        run: |
          mkdir -p docs/anomalias-temperatura
          cp /tmp/mapas-termicos.png docs/anomalias-temperatura/visor-6-mapas.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/anomalias-temperatura/visor-6-mapas.png
          if ! git diff --cached --quiet; then
            git commit -m "Agregar captura de anomalías de temperatura y visor 6 mapas"
            git push origin HEAD:feature/anomalia-temperatura-24-48-72
          fi
