name: Monitoreo extremo - ZIP experimental para visor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"    # misma hora multimodelo: 04 UTC (01:00 Argentina)
    - cron: "0 18 * * *"   # misma hora multimodelo: 18 UTC (15:00 Argentina)
  push:
    branches:
      - master
    paths:
      - python/alertas_web/**
      - web/cartografia/**
      - web/monitoreo-extremo/**
      - vigilancia/config/umbrales.csv
      - .github/workflows/generar-zip-alertas-web.yml

permissions:
  contents: read

concurrency:
  group: monitoreo-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seleccion_ciclo:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.ciclo.outputs.run }}
    steps:
      - name: Elegir ciclo 00/12 UTC con 8 horas de disponibilidad
        id: ciclo
        run: |
          RUN=$(python - <<'PY'
          from datetime import datetime,timedelta,timezone
          # Mínimo 8 horas para que GFS/ECMWF dispongan de los plazos.
          # A las 23 UTC el candidato ya es 12Z, no 00Z.
          # En los horarios del cron (04/18 UTC), los ciclos son
          # 12Z del día anterior / 00Z del mismo día, respectivamente.
          t=datetime.now(timezone.utc)-timedelta(hours=8)
          h=12 if t.hour>=12 else 0
          print(t.strftime('%Y%m%d')+f'{h:02d}')
          PY
          )
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "El ciclo usado por ambos modelos es $RUN UTC"

  extraer:
    needs: seleccion_ciclo
    strategy:
      fail-fast: false
      matrix:
        modelo: [GFS, ECMWF]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar lector GRIB y cliente ECMWF
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "xarray>=2024.1" "cfgrib>=0.9.15" "eccodes>=2" "ecmwf-opendata>=0.3.6" "requests>=2.31"
      - name: Descargar y extraer valores de grilla REAL ${{ matrix.modelo }}
        run: |
          python python/alertas_web/probar_grib_real.py \
            --modelo "${{ matrix.modelo }}" \
            --run-utc "${{ needs.seleccion_ciclo.outputs.run }}" \
            --output salida_grilla
      - name: Verificar CSV y metadatos sin emitir alertas
        env:
          MODELO: ${{ matrix.modelo }}
        run: |
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          m=os.environ["MODELO"].lower()
          p=Path("salida_grilla")
          meta=json.loads((p/f"manifest_{m}.json").read_text())
          rows=list(csv.DictReader((p/f"grilla_{m}_real.csv").open(),delimiter=";"))
          assert len(meta["datos"])==12 and len(rows)>100
          assert sorted(set(int(r["lead_h"]) for r in rows))==list(range(6,73,6))
          assert all(r["estado"]=="GRIB_REAL_EXPERIMENTAL_NO_ALERTA" for r in rows)
          assert meta["estado"]=="GRIB_REAL_EXPERIMENTAL_NO_ALERTA"
          print(f"OK {m}: {len(rows)} puntos, doce plazos f006...f072")
          print("Intervalos de precipitación:", [(x["f"],x["precip_grib_stepRange"],x["precip_interval_h"]) for x in meta["datos"]])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grilla-real-${{ matrix.modelo }}-lab
          path: |
            salida_grilla/*.csv
            salida_grilla/*.json
          if-no-files-found: warn
          retention-days: 3

  combinar:
    needs: extraer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar numpy, pandas, shapely
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "shapely>=2,<3" "scipy>=1.11" "rasterio>=1.3"
      - uses: actions/download-artifact@v4
        with:
          pattern: grilla-real-*-lab
          merge-multiple: true
          path: grillas
      - name: Validar máscaras digitales de SMN 2024
        run: |
          PYTHONPATH=python/alertas_web python - <<'PY'
          import numpy as np
          from regiones_smn2024 import mascara, asignar_nombres
          for tipo,max_id in [('LLUVIA',8),('VIENTO',4)]:
              m=mascara(tipo)
              assert max_id in np.unique(m)
              assert 0 in np.unique(m)
              names=asignar_nombres(tipo,np.arange(-55,-20,.25),np.arange(-85,-45,.25))
              assert names.shape==(140,160)
              assert np.count_nonzero(names)>500
              assert not np.any(names=='ZONDA_SIN_UMBRAL_DE_VIENTO')
              print(tipo,np.count_nonzero(names),'puntos seguros de referencia')
          PY
      - name: Aplicar umbrales regionales SOLO EN AREAS EXPERIMENTALES
        run: |
          python python/alertas_web/clasificar_grilla_regional_lab.py \
            --gfs grillas/grilla_gfs_real.csv \
            --ecmwf grillas/grilla_ecmwf_real.csv \
            --repo . \
            --out salidas_regionales
      - name: Controlar seis mapas y no publicacion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('salidas_regionales/manifest.json').read_text())
          assert m['publicacion_autorizada'] is False
          assert len(m['capas'])==6
          for tipo in ('lluvia','viento'):
              path=Path(f'salidas_regionales/regiones_umbrales_{tipo}_smn2024_PRELIMINAR.geojson')
              geo=json.loads(path.read_text())
              assert geo['metadata']['uso_operativo_autorizado'] is False
              assert len(geo['features']) >= (8 if tipo=='lluvia' else 3)
          for f in m['capas'].values():
              js=json.loads((Path('salidas_regionales')/f).read_text())
              assert js['type']=='FeatureCollection'
              assert all(x['properties']['ambito']=='EXPERIMENTAL' for x in js['features'])
          assert (Path('salidas_regionales/grilla_gfs_ecmwf_real.csv').stat().st_size > 2000)
          print('OK: seis capas de umbrales experimentales, CSV y manifest. NO SE PUBLICA.')
          PY
      - name: Publicar ZIP en GitHub Actions (NO alerta operativa)
        uses: actions/upload-artifact@v4
        with:
          name: alertas-regionales-reales-EXPERIMENTAL
          path: salidas_regionales/
          retention-days: 14


  publicar_pages:
    name: Publicar visor FAA en GitHub Pages
    # Se reemplaza la web SOLO cuando los dos modelos y las seis capas terminaron bien.
    needs: combinar
    if: ${{ github.ref == 'refs/heads/master' && needs.combinar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar ZIP regional validado
        uses: actions/download-artifact@v4
        with:
          name: alertas-regionales-reales-EXPERIMENTAL
          path: salidas_publicacion
      - name: Construir sitio estático y verificar contenido
        run: |
          python - <<'PY'
          import csv, json, zipfile
          from pathlib import Path
          from datetime import datetime, timezone
          entrada=Path('salidas_publicacion')
          web=Path('web/monitoreo-extremo/index.html')
          sitio=Path('_site')
          datos=sitio/'datos'
          datos.mkdir(parents=True,exist_ok=True)
          assert web.is_file(), 'No existe el visor web FAA'
          html=web.read_text(encoding='utf-8')
          assert 'cargarPublicacionAutomatica();' in html
          assert 'Meteorología FAA' in html
          assert 'id="prevDay"' in html
          files=['grilla_gfs_ecmwf_real.csv','manifest.json']
          for fen in ('lluvia','viento'):
              for lead in (24,48,72):
                  files.append(f'{fen}_{lead}h.geojson')
          for name in files:
              p=entrada/name
              assert p.is_file() and p.stat().st_size>0, f'Falta {name}'
          m=json.loads((entrada/'manifest.json').read_text(encoding='utf-8'))
          assert m['publicacion_autorizada'] is False
          assert len(m['capas'])==6
          assert m['run_time'].endswith('Z')
          for name in files[2:]:
              capa=json.loads((entrada/name).read_text(encoding='utf-8'))
              assert capa['type']=='FeatureCollection'
              assert all(f['properties'].get('ambito')=='EXPERIMENTAL' for f in capa['features'])
          with (entrada/files[0]).open(encoding='utf-8', newline='') as f:
              lector=csv.DictReader(f, delimiter=';')
              assert {'model','run_time','lead_h','lat','lon','precip_interval_mm','wind_kmh','gust_kmh'} <= set(lector.fieldnames)
              cnt=0
              modelos=set()
              plazos=set()
              ciclos=set()
              for fila in lector:
                  cnt+=1
                  modelos.add(fila['model'])
                  plazos.add(int(fila['lead_h']))
                  ciclos.add(fila['run_time'])
          assert cnt>1000 and modelos=={'GFS','ECMWF'} and plazos=={24,48,72}
          assert ciclos=={m['run_time']}, 'CSV y metadatos pertenecen a corridas diferentes'
          (sitio/'index.html').write_text(html,encoding='utf-8')
          base=Path('web/monitoreo-extremo/base-cartography.js')
          assert base.is_file(), 'Falta la cartografía base versionada'
          (sitio/'base-cartography.js').write_bytes(base.read_bytes())
          (sitio/'.nojekyll').write_text('',encoding='utf-8')
          with zipfile.ZipFile(datos/'monitoreo-extremo.zip','w',
                               compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name in files:
                  z.write(entrada/name,arcname=name)
          publicado=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          info={'estado':'PUBLICADO','ciclo_utc':m['run_time'],
                'publicado_utc':publicado,'modelos':sorted(modelos),
                'registros':cnt,'capas_geojson':6,
                'dominio':m['dominio'],'publicacion_autorizada':False,
                'tipo':'MONITOREO_EXPERIMENTAL_NO_OPERATIVO',
                'fuente_workflow':'Monitoreo extremo',
                'sha_codigo':'${{ github.sha }}'}
          (datos/'publicacion.json').write_text(
              json.dumps(info,ensure_ascii=False,indent=2),encoding='utf-8')
          assert zipfile.ZipFile(datos/'monitoreo-extremo.zip').testzip() is None
          print('OK: sitio listo, GFS + ECMWF, 6 capas, ciclo',m['run_time'],
                'registros',cnt,'tamaño ZIP', (datos/'monitoreo-extremo.zip').stat().st_size)
          print('Página NO OPERATIVA, publicación del sitio habilitada solo tras validación.')
          PY
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio estático a GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar última corrida válida
        id: deployment
        uses: actions/deploy-pages@v4
