name: Validar anomalías de temperatura 24/48/72 (desarrollo)

on:
  workflow_dispatch:
  push:
    branches: [feature/anomalia-temperatura-24-48-72]
    paths:
      - .github/workflows/probar-anomalia-experimental.yml
      - python/alertas_web/probar_grib_real.py
      - python/alertas_web/anomalia_temperatura.py
      - python/alertas_web/clasificar_grilla_regional_lab.py
      - web/monitoreo-extremo/index.html
      - web/monitoreo-extremo/climatologia_t2m_1991_2020.json


permissions:
  contents: read

concurrency:
  group: test-temperatura-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seleccion_ciclo:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.ciclo.outputs.run }}
    steps:
      - name: Elegir ciclo 00/12 UTC con 8 horas de disponibilidad
        id: ciclo
        run: |
          RUN=$(python - <<'PY'
          from datetime import datetime,timedelta,timezone
          # Mínimo 8 horas para que GFS/ECMWF dispongan de los plazos.
          # A las 23 UTC el candidato ya es 12Z, no 00Z.
          # En los horarios del cron (04/18 UTC), los ciclos son
          # 12Z del día anterior / 00Z del mismo día, respectivamente.
          t=datetime.now(timezone.utc)-timedelta(hours=8)
          h=12 if t.hour>=12 else 0
          print(t.strftime('%Y%m%d')+f'{h:02d}')
          PY
          )
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "El ciclo usado por ambos modelos es $RUN UTC"

  extraer:
    needs: seleccion_ciclo
    strategy:
      fail-fast: false
      matrix:
        modelo: [GFS, ECMWF]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar lector GRIB y cliente ECMWF
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "xarray>=2024.1" "cfgrib>=0.9.15" "eccodes>=2" "ecmwf-opendata>=0.3.6" "requests>=2.31"
      - name: Descargar y extraer valores de grilla REAL ${{ matrix.modelo }}
        run: |
          python python/alertas_web/probar_grib_real.py \
            --modelo "${{ matrix.modelo }}" \
            --run-utc "${{ needs.seleccion_ciclo.outputs.run }}" \
            --output salida_grilla
      - name: Verificar CSV y metadatos sin emitir alertas
        env:
          MODELO: ${{ matrix.modelo }}
        run: |
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          m=os.environ["MODELO"].lower()
          p=Path("salida_grilla")
          meta=json.loads((p/f"manifest_{m}.json").read_text())
          rows=list(csv.DictReader((p/f"grilla_{m}_real.csv").open(),delimiter=";"))
          assert len(meta["datos"])==12 and len(rows)>100
          assert 'temp2m_c' in rows[0], 'No se extrajo T2m para la anomalía'
          assert all(x.get('temp2m_disponible') is True for x in meta['datos'])
          assert sorted(set(int(r["lead_h"]) for r in rows))==list(range(6,73,6))
          assert all(r["estado"]=="GRIB_REAL_EXPERIMENTAL_NO_ALERTA" for r in rows)
          assert meta["estado"]=="GRIB_REAL_EXPERIMENTAL_NO_ALERTA"
          print(f"OK {m}: {len(rows)} puntos, doce plazos f006...f072")
          print("Intervalos de precipitación:", [(x["f"],x["precip_grib_stepRange"],x["precip_interval_h"]) for x in meta["datos"]])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grilla-real-${{ matrix.modelo }}-lab
          path: |
            salida_grilla/*.csv
            salida_grilla/*.json
          if-no-files-found: warn
          retention-days: 3

  combinar:
    needs: extraer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar numpy, pandas, shapely
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "shapely>=2,<3" "scipy>=1.11" "rasterio>=1.3"
      - uses: actions/download-artifact@v4
        with:
          pattern: grilla-real-*-lab
          merge-multiple: true
          path: grillas
      - name: Validar máscaras digitales de SMN 2024
        run: |
          PYTHONPATH=python/alertas_web python - <<'PY'
          import numpy as np
          from regiones_smn2024 import mascara, asignar_nombres
          for tipo,max_id in [('LLUVIA',8),('VIENTO',4)]:
              m=mascara(tipo)
              assert max_id in np.unique(m)
              assert 0 in np.unique(m)
              names=asignar_nombres(tipo,np.arange(-55,-20,.25),np.arange(-85,-45,.25))
              assert names.shape==(140,160)
              assert np.count_nonzero(names)>500
              assert not np.any(names=='ZONDA_SIN_UMBRAL_DE_VIENTO')
              print(tipo,np.count_nonzero(names),'puntos seguros de referencia')
          PY
      - name: Aplicar umbrales regionales SOLO EN AREAS EXPERIMENTALES
        run: |
          python python/alertas_web/clasificar_grilla_regional_lab.py \
            --gfs grillas/grilla_gfs_real.csv \
            --ecmwf grillas/grilla_ecmwf_real.csv \
            --repo . \
            --out salidas_regionales
      - name: Controlar seis mapas y no publicacion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('salidas_regionales/manifest.json').read_text())
          assert m['publicacion_autorizada'] is False
          assert len(m['capas'])==6
          assert m['temperatura']['normal']=='NASA POWER / MERRA-2 1991-2020'
          import csv
          with (Path('salidas_regionales')/'grilla_gfs_ecmwf_real.csv').open() as archivo:
              lector=csv.DictReader(archivo,delimiter=';')
              assert {'temp_mean_24h_c','temp_climatology_c','temp_anomaly_c'} <= set(lector.fieldnames)
              for i, fila in enumerate(lector):
                  assert all(fila[col] for col in ('temp_mean_24h_c','temp_climatology_c','temp_anomaly_c'))
                  if i>5000: break
          for tipo in ('lluvia','viento'):
              path=Path(f'salidas_regionales/regiones_umbrales_{tipo}_smn2024_PRELIMINAR.geojson')
              geo=json.loads(path.read_text())
              assert geo['metadata']['uso_operativo_autorizado'] is False
              assert len(geo['features']) >= (8 if tipo=='lluvia' else 3)
          for f in m['capas'].values():
              js=json.loads((Path('salidas_regionales')/f).read_text())
              assert js['type']=='FeatureCollection'
              assert all(x['properties']['ambito']=='EXPERIMENTAL' for x in js['features'])
          assert (Path('salidas_regionales/grilla_gfs_ecmwf_real.csv').stat().st_size > 2000)
          print('OK: seis capas de umbrales experimentales, CSV y manifest. NO SE PUBLICA.')
          PY
      - name: Publicar ZIP en GitHub Actions (NO alerta operativa)
        uses: actions/upload-artifact@v4
        with:
          name: alertas-regionales-reales-EXPERIMENTAL
          path: salidas_regionales/
          retention-days: 14


  probar_browser:
    name: Probar seis mapas con Chromium y GRIB real
    needs: combinar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: alertas-regionales-reales-EXPERIMENTAL
          path: /tmp/capas
      - name: Comprobar grilla térmica, armar ZIP meteorológico real
        run: |
          python - <<'PY'
          import json,csv,zipfile
          from pathlib import Path
          p=Path('/tmp/capas')
          m=json.loads((p/'manifest.json').read_text())
          assert m['temperatura']['normal']=='NASA POWER / MERRA-2 1991-2020'
          with (p/'grilla_gfs_ecmwf_real.csv').open() as f:
              reader=csv.DictReader(f,delimiter=';')
              assert {'temp_mean_24h_c','temp_climatology_c','temp_anomaly_c'}<=set(reader.fieldnames)
              data=next(reader)
              assert all(data[k] for k in ('temp_mean_24h_c','temp_climatology_c','temp_anomaly_c'))
          with zipfile.ZipFile('/tmp/meteo-real.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for file in p.iterdir():
                  if file.suffix in ('.csv','.geojson','.json'):
                      z.write(file,arcname=file.name)
          Path('/tmp/publicacion.json').write_text(json.dumps({'estado':'PUBLICADO','ciclo_utc':m['run_time'],'publicado_utc':m['run_time'],'publicacion_autorizada':False}))
          print('Datos de temperatura verificados, ciclo',m['run_time'])
          PY
      - name: Preparar navegador
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Validar seis mapas, georreferenciación y termometría con datos reales
        run: |
          python web/monitoreo-extremo/tests/localidades-browser.py \
            --zip /tmp/meteo-real.zip \
            --metadata /tmp/publicacion.json \
            --screenshot /tmp/temperatura-3dias.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-anomalia-termica-grib-real
          path: /tmp/temperatura-3dias.png
          if-no-files-found: ignore
