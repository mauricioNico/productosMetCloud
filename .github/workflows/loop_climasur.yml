name: Generar loop ClimaSur

on:
  workflow_dispatch:

jobs:
  generar-loop:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Pillow
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Crear carpeta de trabajo
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "ARG_INFR"
          New-Item -ItemType Directory -Force -Path "salida"

      - name: Descargar ultimas 6 imagenes de ClimaSur
        shell: powershell
        run: |
          $pagina = "https://www.climasurgba.com.ar/satelite/goes-topes-nubosos"

          Write-Host "Consultando ClimaSur..."

          $html = (Invoke-WebRequest -Uri $pagina -UseBasicParsing).Content

          $matches = [regex]::Matches(
              $html,
              '/satelite/goes-east-13-[0-9]{8}-[0-9]{6}\.png'
          )

          $urls = @()

          foreach ($m in $matches) {
              if ($urls -notcontains $m.Value) {
                  $urls += $m.Value
              }
          }

          Write-Host "Imagenes disponibles: $($urls.Count)"

          $urls = @($urls | Select-Object -First 6)

          if ($urls.Count -lt 2) {
              throw "No se encontraron suficientes imagenes"
          }

          # ClimaSur devuelve primero la imagen mas reciente.
          # Invertimos para animar de la mas antigua a la mas nueva.
          [array]::Reverse($urls)

          Add-Type -AssemblyName System.Drawing

          $contador = 1

          foreach ($url in $urls) {

              $numero = "{0:D2}" -f $contador

              $urlCompleta = "https://www.climasurgba.com.ar$url"

              $png = "goes_$numero.png"
              $jpg = "ARG_INFR\goes_$numero.jpg"

              Write-Host "Descargando:"
              Write-Host $urlCompleta

              Invoke-WebRequest `
                -Uri $urlCompleta `
                -OutFile $png

              $imagen = [System.Drawing.Image]::FromFile(
                  (Resolve-Path $png)
              )

              $destino = Join-Path $PWD $jpg

              $imagen.Save(
                  $destino,
                  [System.Drawing.Imaging.ImageFormat]::Jpeg
              )

              $imagen.Dispose()

              Remove-Item $png

              Write-Host "Generado: $jpg"

              $contador++
          }

      - name: Verificar imagenes
        shell: powershell
        run: |
          Write-Host "Imagenes disponibles para la animacion:"
          Get-ChildItem ARG_INFR\*.jpg

      - name: Generar GIF animado
        shell: powershell
        run: |
          @'
          from PIL import Image
          from pathlib import Path

          carpeta = Path("ARG_INFR")
          salida = Path("salida/loop_climasur.gif")

          archivos = sorted(carpeta.glob("goes_*.jpg"))

          print("Imagenes encontradas:", len(archivos))

          if len(archivos) < 2:
              raise Exception("No hay suficientes imagenes para crear el GIF")

          frames = []

          for archivo in archivos:
              print("Procesando:", archivo)
              imagen = Image.open(archivo).convert("RGB")
              frames.append(imagen)

          frames[0].save(
              salida,
              save_all=True,
              append_images=frames[1:],
              duration=600,
              loop=0,
              optimize=True
          )

          print("GIF generado:", salida)
          print("Tamaño:", salida.stat().st_size, "bytes")
          '@ | python

      - name: Verificar tamaño del GIF
        shell: powershell
        run: |
          $gif = Get-Item "salida\loop_climasur.gif"

          $bytes = $gif.Length
          $mb = [math]::Round($bytes / 1MB, 2)

          Write-Host "=========================================="
          Write-Host "GIF generado correctamente"
          Write-Host "=========================================="
          Write-Host "Archivo: $($gif.Name)"
          Write-Host "Tamaño: $mb MB"
          Write-Host "=========================================="

          if ($bytes -gt 5MB) {
              Write-Host "ADVERTENCIA:"
              Write-Host "El GIF supera los 5 MB."
          }
          else {
              Write-Host "El GIF esta por debajo de 5 MB."
          }

      - name: Subir GIF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: loop-climasur
          path: salida/loop_climasur.gif
          retention-days: 7
