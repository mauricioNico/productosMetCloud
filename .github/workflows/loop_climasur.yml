name: Generar loop ClimaSur con Java

on:

  # ============================================================
  # EJECUCION AUTOMATICA
  # ============================================================
  # Se ejecuta cuando termina el workflow principal.
  #
  # Se ejecuta cuando termina correctamente el workflow multimodelo.
  # ============================================================

  workflow_run:
    workflows:
       - "Generar productos multimodelo"
    types:
      - completed

  # ============================================================
  # EJECUCION MANUAL
  # ============================================================

  workflow_dispatch:


jobs:

  generar-loop:

    # ============================================================
    # EJECUTAR SI:
    #
    # 1. Se lanzó manualmente
    #
    # O
    #
    # 2. El workflow anterior terminó correctamente
    # ============================================================

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: windows-latest

    steps:

      # ==========================================================
      # DESCARGAR REPOSITORIO
      # ==========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ==========================================================
      # JAVA 17
      # ==========================================================

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ==========================================================
      # CREAR ESTRUCTURA
      # ==========================================================

      - name: Crear estructura C descarga_modelos
        shell: powershell
        run: |

          $fecha = Get-Date -Format "yyyyMMdd"

          echo "FECHA=$fecha" >> $env:GITHUB_ENV

          Write-Host "Fecha: $fecha"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "C:\descarga_modelos\$fecha\ARG_INFR"

          Copy-Item `
            "${{ github.workspace }}\loopSatelital.jar" `
            "C:\descarga_modelos\loopSatelital.jar"

          Write-Host ""
          Write-Host "Estructura creada:"

          Get-ChildItem "C:\descarga_modelos"


      # ==========================================================
      # DESCARGAR IMAGENES CLIMASUR
      # ==========================================================

      - name: Descargar ultimas 6 imagenes de ClimaSur
        shell: powershell
        run: |

          $pagina = "https://www.climasurgba.com.ar/satelite/goes-topes-nubosos"

          Write-Host "=========================================="
          Write-Host "CONSULTANDO CLIMASUR"
          Write-Host "=========================================="

          $html = (
            Invoke-WebRequest `
              -Uri $pagina `
              -UseBasicParsing
          ).Content

          $matches = [regex]::Matches(
            $html,
            '/satelite/goes-east-13-[0-9]{8}-[0-9]{6}\.png'
          )

          $urls = @()

          foreach ($m in $matches) {

            if ($urls -notcontains $m.Value) {

              $urls += $m.Value

            }

          }

          Write-Host "Imagenes disponibles: $($urls.Count)"

          $urls = @(
            $urls |
            Select-Object -First 6
          )

          if ($urls.Count -lt 2) {

            throw "No se encontraron suficientes imagenes"

          }


          # ======================================================
          # ClimaSur entrega primero la mas reciente.
          # Invertimos para generar la animacion cronologicamente.
          # ======================================================

          [array]::Reverse($urls)


          Add-Type -AssemblyName System.Drawing


          $contador = 1


          foreach ($url in $urls) {

            $numero = "{0:D2}" -f $contador

            $urlCompleta = "https://www.climasurgba.com.ar$url"

            $png = "$env:TEMP\goes_$numero.png"

            $jpg = "C:\descarga_modelos\$env:FECHA\ARG_INFR\goes_$numero.jpg"

            Write-Host ""
            Write-Host "Descargando imagen $contador de 6"
            Write-Host $urlCompleta


            Invoke-WebRequest `
              -Uri $urlCompleta `
              -OutFile $png


            $imagen = [System.Drawing.Image]::FromFile(
              $png
            )


            $imagen.Save(
              $jpg,
              [System.Drawing.Imaging.ImageFormat]::Jpeg
            )


            $imagen.Dispose()


            Remove-Item $png


            Write-Host "Guardada:"
            Write-Host $jpg


            $contador++

          }


      # ==========================================================
      # VERIFICAR ARCHIVOS
      # ==========================================================

      - name: Verificar estructura antes de Java
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ESTRUCTURA QUE VERA EL JAR"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "JAR:"

          Get-Item "C:\descarga_modelos\loopSatelital.jar"


          Write-Host ""
          Write-Host "Carpeta:"

          Write-Host "C:\descarga_modelos\$env:FECHA\ARG_INFR"


          Write-Host ""
          Write-Host "Imagenes:"


          Get-ChildItem `
            "C:\descarga_modelos\$env:FECHA\ARG_INFR\*.jpg"


      # ==========================================================
      # GENERAR GIF CON JAVA
      # ==========================================================

      - name: Generar animacion con Java
        shell: cmd
        working-directory: C:\descarga_modelos
        run: |

          echo ==========================================
          echo GENERANDO GIF CON JAVA
          echo ==========================================

          java -jar loopSatelital.jar /ARG_INFR/


      # ==========================================================
      # VERIFICAR GIF
      # ==========================================================

      - name: Verificar GIF generado
        shell: powershell
        run: |

          $gif = "C:\descarga_modelos\$env:FECHA\ARG_INFR\loopSatelital.gif"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "VERIFICANDO GIF"
          Write-Host "=========================================="


          if (-not (Test-Path $gif)) {

            throw "Java no genero loopSatelital.gif"

          }


          $archivo = Get-Item $gif


          $mb = [math]::Round(
            $archivo.Length / 1MB,
            2
          )


          Write-Host ""
          Write-Host "Archivo:"
          Write-Host $archivo.FullName


          Write-Host ""
          Write-Host "Tamanio:"
          Write-Host "$mb MB"


          Write-Host ""
          Write-Host "GIF generado correctamente."


      # ==========================================================
      # PREPARAR ARTIFACT
      # ==========================================================

      - name: Preparar GIF para descarga
        shell: powershell
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${{ github.workspace }}\salida"


          Copy-Item `
            "C:\descarga_modelos\$env:FECHA\ARG_INFR\loopSatelital.gif" `
            "${{ github.workspace }}\salida\loopSatelital.gif"


      # Radar independiente: un fallo no impide conservar el GIF satelital.
      - name: Descargar radar Ezeiza y generar animacion con Java
        id: radar
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pagina = "https://www.climasurgba.com.ar/radar/ezeiza"
          $html = (Invoke-WebRequest -Uri $pagina -UseBasicParsing -TimeoutSec 60).Content
          $urls = @(
            [regex]::Matches($html, '/radar/ezeiza-[0-9]{8}-[0-9]{6}\.png') |
            ForEach-Object { $_.Value } |
            Sort-Object -Unique |
            Select-Object -Last 12
          )
          if ($urls.Count -lt 2) {
            throw "Ezeiza: se necesitan al menos 2 imagenes para una animacion."
          }

          $fechaRadar = Get-Date -Format "yyyyMMdd"
          $carpeta = "C:\descarga_modelos\$fechaRadar\RADAR_EZEIZA"
          New-Item -ItemType Directory -Force -Path $carpeta | Out-Null
          Add-Type -AssemblyName System.Drawing
          $headers = @{ Referer = $pagina }
          $numero = 0
          foreach ($url in $urls) {
            $numero++
            $png = Join-Path $carpeta ("radar_{0:D2}.png" -f $numero)
            Write-Host "Ezeiza $numero/$($urls.Count): $url"
            Invoke-WebRequest -Uri "https://www.climasurgba.com.ar$url" -OutFile $png -TimeoutSec 60 -Headers $headers -UserAgent "Mozilla/5.0"
          }

          # El generador fuente ordena por nombre y conserva los PNG originales.
          $destino = Join-Path $carpeta "gif"
          java "${{ github.workspace }}\src\main\java\CrearGifDesdeCarpeta.java" $carpeta $destino 500
          if ($LASTEXITCODE -ne 0) { throw "Java fallo al generar el radar: $LASTEXITCODE" }
          $generados = @(Get-ChildItem $destino -Filter "animacion_satelite_*.gif")
          if ($generados.Count -ne 1 -or $generados[0].Length -eq 0) {
            throw "Java no genero un unico GIF de radar valido."
          }
          $gif = $generados[0].FullName

          $animacion = [System.Drawing.Image]::FromFile($gif)
          try {
            $frames = $animacion.GetFrameCount([System.Drawing.Imaging.FrameDimension]::Time)
            if ($frames -lt 2) { throw "El GIF de radar tiene menos de 2 cuadros." }
            Write-Host "GIF Ezeiza: $frames cuadros, $((Get-Item $gif).Length) bytes"
          } finally {
            $animacion.Dispose()
          }
          Copy-Item $gif "${{ github.workspace }}\salida\loopRadarEzeiza.gif"
          "Radar Ezeiza: $($urls.Count) imagenes, de $($urls[0]) a $($urls[-1])." >> $env:GITHUB_STEP_SUMMARY

      # ==========================================================
      # SUBIR ARTIFACT
      # ==========================================================

      - name: Subir GIF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: loop-satelital-climasur
          path: salida/*.gif
          retention-days: 7

      - name: Informar fallo del radar sin perder el artifact satelital
        if: always() && steps.radar.outcome == 'failure'
        shell: powershell
        run: |
          throw "Fallo el radar Ezeiza. El GIF satelital se conserva en el artifact si su generacion finalizo correctamente."
