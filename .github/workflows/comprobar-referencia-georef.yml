name: Probar tooltip GeoRef por clic (desarrollo)

on:
  workflow_dispatch:
  push:
    branches: [feature/referencia-localidad-clic]
    paths:
      - .github/workflows/comprobar-referencia-georef.yml
      - web/monitoreo-extremo/index.html
      - web/monitoreo-extremo/localidades-layer.js
      - web/monitoreo-extremo/tests/localidades-browser.py
      - web/monitoreo-extremo/tests/referencia-localidad.test.cjs

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probar distancias y localidades cercanas
        run: |
          node web/monitoreo-extremo/tests/referencia-localidad.test.cjs
          node --check web/monitoreo-extremo/localidades-layer.js
          node - <<'JS'
          const fs=require('node:fs');
          const html=fs.readFileSync('web/monitoreo-extremo/index.html','utf8');
          new Function(html.slice(html.lastIndexOf('<script>')+8,html.lastIndexOf('</script>')));
          console.log('Visor JavaScript: sintaxis OK');
          JS
      - name: Preparar Chromium
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Descargar publicación real GFS/ECMWF para prueba
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            'https://mauricionico.github.io/productosMetCloud/datos/monitoreo-extremo.zip' \
            --output /tmp/real.zip
          curl --fail --location --retry 3 --silent --show-error \
            'https://mauricionico.github.io/productosMetCloud/datos/publicacion.json' \
            --output /tmp/publicacion.json
      - name: Comprobar clic y distancia en los cuatro mapas con datos reales
        run: |
          python web/monitoreo-extremo/tests/localidades-browser.py \
            --zip /tmp/real.zip --metadata /tmp/publicacion.json \
            --screenshot /tmp/referencia-georef.png
      - name: Guardar captura del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprobacion-tooltips-distancias
          path: /tmp/referencia-georef.png
          if-no-files-found: ignore
