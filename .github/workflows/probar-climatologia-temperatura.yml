name: Probar NASA POWER climatología regional (desarrollo)
on:
  workflow_dispatch:
  push:
    branches: [feature/anomalia-temperatura-24-48-72]
    paths:
      - .github/workflows/probar-climatologia-temperatura.yml
      - python/alertas_web/probar_climatologia_nasa.py
permissions:
  contents: read
jobs:
  verificar_nasa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar librerías climatológicas
        run: python -m pip install requests xarray netcdf4
      - name: Probar climatología de temperatura 1991-2020 en región pequeña
        run: python python/alertas_web/probar_climatologia_nasa.py
