name: Generar climatología térmica NASA POWER (desarrollo)
on:
  workflow_dispatch:
  push:
    branches: [feature/anomalia-temperatura-24-48-72]
    paths:
      - .github/workflows/probar-climatologia-temperatura.yml
      - python/alertas_web/generar_climatologia_temperatura.py
permissions:
  contents: write
jobs:
  comprobar_clima:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar librerías climáticas
        run: python -m pip install requests xarray netCDF4 numpy
      - name: Descargar, ensamblar y validar normal NASA 1991-2020
        run: python python/alertas_web/generar_climatologia_temperatura.py
      - name: Registrar referencia climática en rama de desarrollo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/monitoreo-extremo/climatologia_t2m_1991_2020.json
          git diff --cached --quiet && exit 0
          git commit -m "Registrar climatología NASA POWER T2M 1991-2020 validada"
          git push origin HEAD:feature/anomalia-temperatura-24-48-72
