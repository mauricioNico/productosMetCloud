name: Verificar empaquetado de Pages con anomalías
on:
  workflow_dispatch:
  push:
    branches: [feature/anomalia-temperatura-24-48-72]
    paths:
      - .github/workflows/probar-publicacion-temperatura.yml
      - .github/workflows/generar-zip-alertas-web.yml
permissions:
  contents: read
  actions: read
jobs:
  pages_prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: alertas-regionales-reales-EXPERIMENTAL
          run-id: 38915266753
          github-token: ${{ github.token }}
          path: salidas_publicacion
      - name: Ejecutar la construcción EXACTA de Pages sin desplegar
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          from pathlib import Path
          raw=yaml.safe_load(Path('.github/workflows/generar-zip-alertas-web.yml').read_text())
          job=raw['jobs']['publicar_pages']
          step=next(x for x in job['steps'] if x.get('name')=='Construir sitio estático y verificar contenido')
          source=step['run'].strip()
          prefix="python - <<'PY'"
          if not source.startswith(prefix) or not source.rstrip().endswith('PY'):
              raise RuntimeError('Bloque de Pages inesperado: '+source[:50])
          script=source[len(prefix):].strip()
          script=script.rsplit('\nPY',1)[0]
          exec(compile(script,'validacion-pages.py','exec'),{'__name__':'__main__'})
          assert (Path('_site')/'index.html').is_file()
          assert (Path('_site')/'normales_temperatura_smn_1991_2020.json').is_file()
          assert (Path('_site')/'climatologia_t2m_1991_2020.json').is_file()
          assert (Path('_site')/'validacion_smn_nasa.json').is_file()
          print('SITIO EXPERIMENTAL PREPARADO - NO SE DESPLEGÓ')
          PY
