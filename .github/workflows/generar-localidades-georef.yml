name: Actualizar localidades GeoRef para visor (desarrollo)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/georef-localidades-visor
    paths:
      - .github/workflows/generar-localidades-georef.yml
      - web/monitoreo-extremo/tools/actualizar_localidades_georef.py
      - web/monitoreo-extremo/tests/localidades.test.cjs
      - web/monitoreo-extremo/tests/localidades-browser.py
      - web/monitoreo-extremo/localidades-layer.js
      - web/monitoreo-extremo/index.html

permissions:
  contents: write

jobs:
  generar_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Descargar listado completo GeoRef, verificar y compactar
        run: python web/monitoreo-extremo/tools/actualizar_localidades_georef.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar búsqueda, agrupamiento y origen GeoRef
        run: node web/monitoreo-extremo/tests/localidades.test.cjs
      - name: Comprobar sintaxis del visor y el módulo de localidades
        run: |
          node --check web/monitoreo-extremo/localidades-layer.js
          node - <<'JS'
          const fs=require('fs');
          const s=fs.readFileSync('web/monitoreo-extremo/index.html','utf8');
          const js=s.slice(s.lastIndexOf('<script>')+8,s.lastIndexOf('</script>'));
          new Function(js);
          if(!s.includes('localidades-layer.js')||!s.includes('placeSearch'))throw Error('Buscador sin integrar');
          console.log('HTML y JS: sintaxis y referencias OK.');
          JS
      - name: Instalar navegador de pruebas
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Recuperar ZIP meteorológico real publicado
        run: |
          curl --fail --location --retry 3 --silent --show-error             'https://mauricionico.github.io/productosMetCloud/datos/monitoreo-extremo.zip'             --output /tmp/monitoreo-extremo-real.zip
          curl --fail --location --retry 3 --silent --show-error             'https://mauricionico.github.io/productosMetCloud/datos/publicacion.json'             --output /tmp/monitoreo-publicacion.json
      - name: Verificar localidades en Chrome con datos reales de GFS y ECMWF
        run: |
          python web/monitoreo-extremo/tests/localidades-browser.py             --zip /tmp/monitoreo-extremo-real.zip             --metadata /tmp/monitoreo-publicacion.json             --screenshot /tmp/localidades-visor-chromium.png
      - name: Guardar evidencia visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: georef-localidades-captura
          path: /tmp/localidades-visor-chromium.png
          if-no-files-found: ignore
      - name: Versionar snapshot oficial para GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/monitoreo-extremo/localidades-georef.json
          if ! git diff --cached --quiet; then
            git commit -m "Incorporar snapshot oficial de localidades GeoRef"
            git push origin HEAD:feature/georef-localidades-visor
          else
            echo "El snapshot no cambió"
          fi
