name: LAB - Grilla REAL GFS ECMWF (sin publicar)

on:
  workflow_dispatch:
  push:
    branches:
      - test/alertas-web-lluvia-viento
    paths:
      - python/alertas_web/probar_grib_real.py
      - .github/workflows/probar-grilla-real.yml

permissions:
  contents: read

jobs:
  seleccion_ciclo:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.ciclo.outputs.run }}
    steps:
      - name: Elegir ciclo 00/12 UTC con margen de disponibilidad
        id: ciclo
        run: |
          RUN=$(python - <<'PY'
          from datetime import datetime,timedelta,timezone
          t=datetime.now(timezone.utc)-timedelta(hours=14)
          h=12 if t.hour>=12 else 0
          print(t.strftime('%Y%m%d')+f'{h:02d}')
          PY
          )
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "El ciclo usado por ambos modelos es $RUN UTC"

  extraer:
    needs: seleccion_ciclo
    strategy:
      fail-fast: false
      matrix:
        modelo: [GFS, ECMWF]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar lector GRIB y cliente ECMWF
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "xarray>=2024.1" "cfgrib>=0.9.15" "eccodes>=2" "ecmwf-opendata>=0.3.6" "requests>=2.31"
      - name: Descargar y extraer valores de grilla REAL ${{ matrix.modelo }}
        run: |
          python python/alertas_web/probar_grib_real.py \
            --modelo "${{ matrix.modelo }}" \
            --run-utc "${{ needs.seleccion_ciclo.outputs.run }}" \
            --output salida_grilla
      - name: Verificar CSV y metadatos sin emitir alertas
        env:
          MODELO: ${{ matrix.modelo }}
        run: |
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          m=os.environ["MODELO"].lower()
          p=Path("salida_grilla")
          meta=json.loads((p/f"manifest_{m}.json").read_text())
          rows=list(csv.DictReader((p/f"grilla_{m}_real.csv").open(),delimiter=";"))
          assert len(meta["datos"])==3 and len(rows)>100
          assert sorted(set(int(r["lead_h"]) for r in rows))==[24,48,72]
          assert all(r["estado"]=="GRIB_REAL_EXPERIMENTAL_NO_ALERTA" for r in rows)
          assert meta["estado"]=="GRIB_REAL_EXPERIMENTAL_NO_ALERTA"
          print(f"OK {m}: {len(rows)} puntos, plazos f024/f048/f072")
          print("Intervalos de precipitación:", [(x["f"],x["precip_grib_stepRange"],x["precip_interval_h"]) for x in meta["datos"]])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grilla-real-${{ matrix.modelo }}-lab
          path: |
            salida_grilla/*.csv
            salida_grilla/*.json
          if-no-files-found: warn
          retention-days: 3

  combinar:
    needs: extraer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grilla-real-*-lab
          merge-multiple: true
          path: grillas
      - name: Construir CSV compatible con el visor
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path("grillas")
          a=(base/"grilla_gfs_real.csv").read_text(encoding="utf-8").splitlines()
          b=(base/"grilla_ecmwf_real.csv").read_text(encoding="utf-8").splitlines()
          assert a[0]==b[0], "Columnas GFS/ECMWF diferentes"
          out=base/"grilla_gfs_ecmwf_real.csv"
          out.write_text("\n".join(a+b[1:])+"\n", encoding="utf-8")
          print("LISTO:",out,"con",len(a)+len(b)-2,"registros meteorológicos reales")
          PY
      - name: Guardar salida aislada, NO PUBLICABLE
        uses: actions/upload-artifact@v4
        with:
          name: grilla-real-gfs-ecmwf-experimental
          path: grillas/
          retention-days: 7
