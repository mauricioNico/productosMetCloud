<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Monitoreo de bloqueos</title><style>body{font:16px system-ui;max-width:1050px;margin:2rem auto;padding:1rem;background:#f1f5f9;color:#123}table{border-collapse:collapse;width:100%;background:white}td,th{padding:.6rem;border:1px solid #ccd}select,input{padding:.5rem;margin:.4rem}pre{white-space:pre-wrap}</style><h1>Monitoreo de bloqueos atmosféricos</h1><p>Diagnóstico experimental · Mendes et al. (2008) · Z500</p><p>Cargar JSON de los artefactos GFS o ECMWF. No requiere servidor local.</p><input id="file" type="file" accept=".json" multiple><div><select id="model"></select><select id="time"></select><label>Meridiano (° E, negativo al oeste) <select id="lon"></select></label></div><p id="meta"></p><table><thead><tr><th>Δ</th><th>Z norte</th><th>Z 01</th><th>Z 02</th><th>Z sur</th><th>GHGN m</th><th>GHGS m</th><th>Señal</th></tr></thead><tbody id="rows"></tbody></table><h2>Sectores y persistencia prevista</h2><pre id="daily"></pre><script>
const el=id=>document.getElementById(id), datasets=[];
function opts(node,items){node.replaceChildren(...items.map(([v,t])=>new Option(t,v)))}
function run(){const d=datasets[+el('model').value];if(!d)return;const items=[...d.instant,...d.daily.filter(x=>x.rows)];opts(el('time'),items.map((x,i)=>[i,x.valid||x.date+' media diaria']));opts(el('lon'),d.instant[0].rows.map(x=>[x.lon,x.lon]));el('lon').value='-60';show()}
function show(){const d=datasets[+el('model').value];if(!d)return;const x=[...d.instant,...d.daily.filter(x=>x.rows)][+el('time').value];const r=x.rows.find(r=>r.lon===+el('lon').value);el('meta').textContent=d.model+' | '+d.run+' | '+(x.valid||x.date)+' | '+(r.blocked?'Señal local':'Sin señal');el('rows').replaceChildren(...r.details.map(v=>{const tr=document.createElement('tr');for(const a of [v.delta,...v.z.map(z=>(z/10).toFixed(2)),v.ghgn.toFixed(2),v.ghgs.toFixed(2),v.blocked?'Sí':'No']){const td=tr.insertCell();td.textContent=a}return tr}));el('daily').textContent='Z en dam. Sectores del plazo: '+JSON.stringify(x.sectors)+'\n'+d.daily.map(y=>y.date+' '+(y.streak?JSON.stringify(y.streak):'incompleto')).join('\n')+'\nPlazos faltantes: '+Object.keys(d.errors).join(', ')+'\nCinco días previstos no constituyen confirmación por análisis.'}
el('file').onchange=async()=>{try{datasets.length=0;for(const f of el('file').files){const d=JSON.parse(await f.text());if(!d.instant?.length)throw Error('JSON sin datos');datasets.push(d)}opts(el('model'),datasets.map((d,i)=>[i,d.model+' '+d.run]));run()}catch(e){el('meta').textContent=e.message}};el('model').onchange=run;el('time').onchange=el('lon').onchange=show;
</script></html>
